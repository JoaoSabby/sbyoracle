name: R package checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  R-CMD-check:
    runs-on: ubuntu-latest
    env:
      R_KEEP_PKG_SOURCE: 'yes'
      _R_CHECK_FORCE_SUGGESTS_: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.6.0'
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          # Compile the Oracle driver only in the dedicated OCI environment.
          extra-packages: any::rcmdcheck, ROracle=?ignore
          needs: check
      - uses: r-lib/actions/check-r-package@v2
        with:
          args: 'c("--no-manual")'
          error-on: '"warning"'
